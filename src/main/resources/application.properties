spring.application.name=tickets
server.port=${SERVER_PORT:8081}

# Importa la configuracion local si existe. El archivo .env no se versiona.
spring.config.import=optional:file:.env[.properties]

# Base de datos propia de Tickets.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eventpass_tickets}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Debe coincidir con la configuracion de Users.
app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.issuer=${JWT_ISSUER:eventpass-users}
